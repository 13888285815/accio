<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — Accio</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#f9fafb;min-height:100vh;display:flex;flex-direction:column}nav{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 24px;height:64px;display:flex;align-items:center}.logo{font-size:20px;font-weight:700;color:#4f6ef7;text-decoration:none}main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}.card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;padding:40px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,.06)}h1{font-size:24px;font-weight:700;margin-bottom:6px}.sub{font-size:14px;color:#6b7280;margin-bottom:28px}label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}input{width:100%;padding:10px 14px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;margin-bottom:16px;outline:none}input:focus{border-color:#4f6ef7}.btn{width:100%;padding:12px;background:#4f6ef7;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}.btn:hover{background:#3b5bdb}.link{text-align:center;font-size:13px;color:#6b7280;margin-top:20px}.link a{color:#4f6ef7;font-weight:600}</style></head><body><nav><a href="index.html" class="logo">⚡ Accio</a></nav><main><div class="card"><h1>Welcome back</h1><p class="sub">Sign in to your Accio account.</p><form onsubmit="event.preventDefault();alert('Full auth coming soon! Join the waitlist via Sign Up.')"><label>Email</label><input type="email" placeholder="you@example.com" required><label>Password</label><input type="password" placeholder="Your password" required><button type="submit" class="btn">Sign In →</button></form><p class="link">No account? <a href="sign-up.html">Sign up free</a></p></div></main></body></html>
